<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HGSNS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000000;
    --bg2: #16181c;
    --border: #2f3336;
    --text: #e7e9ea;
    --text-sub: #71767b;
    --accent: #1d9bf0;
    --accent-hover: #1a8cd8;
    --like: #f91880;
    --like-bg: rgba(249,24,128,0.1);
    --reply-color: #1d9bf0;
    --reply-bg: rgba(29,155,240,0.1);
    --retweet-color: #00ba7c;
    --hover-bg: rgba(255,255,255,0.03);
    --font: 'Noto Sans JP', -apple-system, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
  }

  .wrapper {
    display: flex;
    max-width: 1265px;
    margin: 0 auto;
    min-height: 100vh;
  }

  /* ── Left sidebar ── */
  .sidebar {
    width: 275px;
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 0 12px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }
  .sidebar-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 50px; height: 50px;
    border-radius: 50%;
    margin: 4px 0 4px -4px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .sidebar-logo:hover { background: rgba(239,243,244,0.1); }
  .sidebar-logo svg { width: 28px; height: 28px; fill: var(--text); }
  .sidebar-nav { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 12px 16px;
    border-radius: 9999px;
    cursor: pointer;
    transition: background 0.2s;
    color: var(--text);
    font-size: 20px;
    font-weight: 400;
    width: fit-content;
  }
  .nav-item:hover { background: var(--hover-bg); }
  .nav-item.active { font-weight: 700; }
  .nav-icon { width: 26px; height: 26px; }
  .tweet-btn {
    margin-top: 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 9999px;
    padding: 16px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    width: 230px;
    transition: background 0.15s;
    font-family: var(--font);
  }
  .tweet-btn:hover { background: var(--accent-hover); }

  /* ── Main column ── */
  .main {
    flex: 1;
    min-width: 0;
    max-width: 600px;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  .col-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    height: 53px;
    display: flex;
    align-items: center;
  }
  .col-header-title { font-size: 20px; font-weight: 700; }

  /* ── Reply banner ── */
  .reply-banner {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 10px 16px 6px 68px;
    font-size: 13px;
    color: var(--text-sub);
    background: rgba(29,155,240,0.05);
    border-bottom: 1px solid var(--border);
  }
  .reply-banner.visible { display: flex; }
  .reply-to-name { color: var(--accent); font-weight: 700; }
  .cancel-reply {
    margin-left: auto;
    cursor: pointer;
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
    color: var(--text-sub);
    font-size: 16px;
  }
  .cancel-reply:hover { background: rgba(255,255,255,0.06); color: var(--text); }

  /* ── Compose ── */
  .compose {
    padding: 12px 16px;
    border-bottom: 8px solid var(--bg2);
    display: flex;
    gap: 12px;
  }
  .compose-avatar {
    flex-shrink: 0;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 17px; color: #fff;
    user-select: none;
  }
  .compose-right { flex: 1; display: flex; flex-direction: column; }
  #name {
    background: transparent;
    border: none;
    outline: none;
    color: var(--accent);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 700;
    width: 100%;
    margin-bottom: 2px;
    caret-color: var(--accent);
  }
  #name::placeholder { color: var(--text-sub); font-weight: 400; }
  #text {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font);
    font-size: 20px;
    line-height: 1.55;
    resize: none;
    width: 100%;
    min-height: 80px;
    caret-color: var(--accent);
  }
  #text::placeholder { color: var(--text-sub); }
  .compose-toolbar {
    display: flex;
    align-items: center;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    margin-top: 12px;
    gap: 4px;
  }
  .toolbar-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
  }
  .toolbar-icon:hover { background: rgba(29,155,240,0.1); }
  .toolbar-icon svg { width: 18px; height: 18px; fill: var(--accent); }
  .char-count {
    margin-left: auto;
    font-size: 14px;
    color: var(--text-sub);
    font-variant-numeric: tabular-nums;
    min-width: 24px;
    text-align: right;
  }
  .char-count.warn { color: #ffd400; }
  .char-count.over { color: var(--like); }
  .post-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 9999px;
    padding: 8px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-left: 12px;
    transition: background 0.15s, opacity 0.15s;
    font-family: var(--font);
    white-space: nowrap;
  }
  .post-btn:disabled { opacity: 0.5; cursor: default; }
  .post-btn:not(:disabled):hover { background: var(--accent-hover); }

  /* ── Tabs ── */
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1;
    text-align: center;
    padding: 16px 0 14px;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-sub);
    cursor: pointer;
    position: relative;
    transition: background 0.15s;
  }
  .tab:hover { background: var(--hover-bg); }
  .tab.active { font-weight: 700; color: var(--text); }
  .tab.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 56px; height: 4px;
    background: var(--accent);
    border-radius: 9999px;
  }

  /* ── Timeline ── */
  #timeline { display: flex; flex-direction: column; }

  /* ── Tweet card ── */
  .tweet {
    display: flex;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
    animation: fadeIn 0.2s ease both;
    cursor: pointer;
  }
  .tweet:hover { background: var(--hover-bg); }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

  .tweet-avatar {
    flex-shrink: 0;
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 17px; color: #fff;
    user-select: none;
  }
  .tweet-body { flex: 1; min-width: 0; }
  .tweet-header {
    display: flex;
    align-items: baseline;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 2px;
  }
  .tweet-name { font-weight: 700; font-size: 15px; color: var(--text); }
  .tweet-handle { font-size: 15px; color: var(--text-sub); }
  .tweet-text {
    font-size: 15px;
    line-height: 1.65;
    color: var(--text);
    word-break: break-word;
    white-space: pre-wrap;
    margin-bottom: 10px;
  }

  /* ── Action bar ── */
  .tweet-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 425px;
    margin: 0 -8px;
  }
  .action-group {
    border-radius: 9999px;
    transition: background 0.15s;
  }
  .action-group:hover { background: var(--reply-bg); }
  .action-group.like:hover { background: var(--like-bg); }
  .action-group.rt:hover { background: rgba(0,186,124,0.1); }
  .action-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    background: transparent;
    border: none;
    padding: 7px 8px;
    border-radius: 9999px;
    cursor: pointer;
    color: var(--text-sub);
    font-size: 13px;
    font-family: var(--font);
    transition: color 0.15s;
    line-height: 1;
  }
  .action-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .action-group:hover .action-btn { color: var(--reply-color); }
  .action-group.like:hover .action-btn { color: var(--like); }
  .action-group.rt:hover .action-btn { color: var(--retweet-color); }
  .action-group.like.liked .action-btn { color: var(--like); }
  .action-count { font-variant-numeric: tabular-nums; }

  /* ── Replies ── */
  .replies-section { border-bottom: 1px solid var(--border); }
  .reply-tweet {
    display: flex;
    gap: 12px;
    padding: 10px 16px 10px 68px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
    animation: fadeIn 0.2s ease both;
    cursor: pointer;
  }
  .reply-tweet:last-child { border-bottom: none; }
  .reply-tweet:hover { background: var(--hover-bg); }
  .reply-avatar {
    flex-shrink: 0;
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #fff;
  }
  .reply-body { flex: 1; min-width: 0; }
  .reply-header { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-bottom: 2px; }
  .reply-name { font-weight: 700; font-size: 14px; color: var(--text); }
  .reply-handle { font-size: 14px; color: var(--text-sub); }
  .reply-text { font-size: 14px; line-height: 1.6; color: var(--text); word-break: break-word; }

  /* ── Empty state ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 32px;
    gap: 12px;
    color: var(--text-sub);
    text-align: center;
  }
  .empty-state svg { width: 42px; height: 42px; fill: var(--text-sub); opacity: 0.3; margin-bottom: 8px; }
  .empty-state strong { font-size: 31px; font-weight: 800; color: var(--text); display: block; }
  .empty-state p { font-size: 15px; }

  /* ── Right sidebar ── */
  .right-sidebar {
    width: 348px;
    flex-shrink: 0;
    padding: 0 16px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .right-sidebar::-webkit-scrollbar { display: none; }
  .search-bar { position: sticky; top: 0; padding: 12px 0; background: var(--bg); z-index: 5; }
  .search-input-wrap {
    background: var(--bg2);
    border: 1px solid transparent;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    padding: 10px 16px;
    gap: 12px;
    transition: border-color 0.15s, background 0.15s;
  }
  .search-input-wrap:focus-within { background: var(--bg); border-color: var(--accent); }
  .search-input-wrap svg { width: 18px; height: 18px; fill: var(--text-sub); flex-shrink: 0; }
  .search-input-wrap input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    font-family: var(--font);
    width: 100%;
  }
  .search-input-wrap input::placeholder { color: var(--text-sub); }
  .widget-box {
    background: var(--bg2);
    border-radius: 16px;
    padding: 12px 0 4px;
    margin-top: 16px;
    overflow: hidden;
  }
  .widget-title { font-size: 20px; font-weight: 800; padding: 0 16px 12px; }
  .trend-item {
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .trend-item:hover { background: var(--hover-bg); }
  .trend-cat { font-size: 13px; color: var(--text-sub); }
  .trend-name { font-size: 15px; font-weight: 700; }
  .trend-count { font-size: 13px; color: var(--text-sub); margin-top: 2px; }

  /* ── Responsive ── */
  @media (max-width: 1200px) { .right-sidebar { display: none; } }
  @media (max-width: 700px) {
    .sidebar { display: none; }
    .main { max-width: 100%; border: none; }
  }
</style>
</head>
<body>

<div class="wrapper">

  <!-- Left Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.696L.622 8.807l1.06 1.696L3 9.679V19.5C3 20.881 4.119 22 5.5 22h4a1 1 0 001-1v-6h3v6a1 1 0 001 1h4c1.381 0 2.5-1.119 2.5-2.5V9.679l1.318.824 1.06-1.696L12 1.696z"/></svg>
        <span>ホーム</span>
      </div>
      <div class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M10.25 3.75c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5c1.795 0 3.419-.726 4.596-1.904 1.178-1.177 1.904-2.801 1.904-4.596 0-3.59-2.91-6.5-6.5-6.5zm-8.5 6.5c0-4.694 3.806-8.5 8.5-8.5s8.5 3.806 8.5 8.5c0 1.986-.682 3.815-1.814 5.262l4.276 4.276-1.414 1.414-4.276-4.276A8.456 8.456 0 0110.25 18.75c-4.694 0-8.5-3.806-8.5-8.5z"/></svg>
        <span>話題を検索</span>
      </div>
      <div class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19.993 9.042C19.48 5.017 16.054 2 11.996 2s-7.49 3.021-7.999 7.051L2.866 18H7.1c.463 2.282 2.481 4 4.9 4s4.437-1.718 4.9-4h4.236l-1.143-8.958zM12 20c-1.316 0-2.434-.847-2.849-2h5.698c-.415 1.153-1.533 2-2.849 2zm-6.866-4l.847-6.698C6.389 6.016 8.952 4 11.996 4s5.607 2.016 6.013 5.295L18.864 16H5.134z"/></svg>
        <span>通知</span>
      </div>
    </nav>
    <button class="tweet-btn" onclick="scrollToCompose()">投稿する</button>
  </aside>

  <!-- Main Column -->
  <main class="main">
    <div class="col-header">
      <span class="col-header-title">ホーム</span>
    </div>

    <div class="reply-banner" id="replyBanner">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--accent)"><path d="M14.046 2.242l-4.148-.01h-.002c-4.374 0-7.8 3.427-7.8 7.802 0 4.098 3.186 7.206 7.465 7.37v3.828c0 .108.044.286.12.403.142.225.384.347.632.347.138 0 .277-.038.402-.118.264-.168 6.473-4.14 8.088-5.506 1.902-1.61 3.04-3.97 3.043-6.312v-.017c-.006-4.367-3.43-7.787-7.8-7.788zm3.787 12.972c-1.134.96-4.862 3.405-6.772 4.643V16.67c0-.414-.335-.75-.75-.75h-.396c-3.66 0-6.318-2.476-6.318-5.886 0-3.534 2.768-6.302 6.3-6.302l4.147.01h.002c3.532 0 6.3 2.766 6.302 6.296-.003 1.91-.942 3.844-2.515 5.176z"/></svg>
      返信先: <span class="reply-to-name" id="replyToName"></span>
      <span class="cancel-reply" onclick="cancelReply()">✕</span>
    </div>

    <div class="compose" id="composeBox">
      <div class="compose-avatar" id="composeAvatarEl">?</div>
      <div class="compose-right">
        <input id="name" placeholder="名前を入力" autocomplete="off" oninput="updateComposeAvatar()">
        <textarea id="text" placeholder="いまどうしてる？" rows="3" oninput="updateCharCount()"></textarea>
        <div class="compose-toolbar">
          <div class="toolbar-icon" title="画像">
            <svg viewBox="0 0 24 24"><path d="M3 5.5C3 4.119 4.119 3 5.5 3h13C19.881 3 21 4.119 21 5.5v13c0 1.381-1.119 2.5-2.5 2.5h-13C4.119 21 3 19.881 3 18.5v-13zM5.5 5c-.276 0-.5.224-.5.5v9.086l3-3 3 3 5-5 3 3V5.5c0-.276-.224-.5-.5-.5h-13zM19 15.414l-3-3-5 5-3-3-3 3V18.5c0 .276.224.5.5.5h13c.276 0 .5-.224.5-.5v-3.086zM9.75 7C8.784 7 8 7.784 8 8.75s.784 1.75 1.75 1.75 1.75-.784 1.75-1.75S10.716 7 9.75 7z"/></svg>
          </div>
          <div class="toolbar-icon" title="絵文字">
            <svg viewBox="0 0 24 24"><path d="M8 9.5C8 8.119 8.672 7 9.5 7S11 8.119 11 9.5 10.328 12 9.5 12 8 10.881 8 9.5zm6.5 0c0-1.381.672-2.5 1.5-2.5s1.5 1.119 1.5 2.5-.672 2.5-1.5 2.5-1.5-1.119-1.5-2.5zM12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8zm-3.5-5h7c-.501 2.498-3.16 4-3.5 4s-2.999-1.502-3.5-4z"/></svg>
          </div>
          <span class="char-count" id="charCount"></span>
          <button class="post-btn" id="postBtn" onclick="post()">投稿する</button>
        </div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active">おすすめ</div>
      <div class="tab">フォロー中</div>
    </div>

    <div id="timeline">
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        <strong>読み込み中…</strong>
      </div>
    </div>
  </main>

  <!-- Right Sidebar -->
  <aside class="right-sidebar">
    <div class="search-bar">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24"><path d="M10.25 3.75c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5c1.795 0 3.419-.726 4.596-1.904 1.178-1.177 1.904-2.801 1.904-4.596 0-3.59-2.91-6.5-6.5-6.5zm-8.5 6.5c0-4.694 3.806-8.5 8.5-8.5s8.5 3.806 8.5 8.5c0 1.986-.682 3.815-1.814 5.262l4.276 4.276-1.414 1.414-4.276-4.276A8.456 8.456 0 0110.25 18.75c-4.694 0-8.5-3.806-8.5-8.5z"/></svg>
        <input type="text" placeholder="検索">
      </div>
    </div>
    <div class="widget-box">
      <div class="widget-title">いまどうなってる</div>
      <div class="trend-item">
        <div class="trend-cat"未定</div>
        <div class="trend-name">製作途中</div>
        <div class="trend-count">114,514件のポスト</div>
      </div>
    </div>
  </aside>

</div>

<script>
  const MAX_CHARS = 280;
  let replyTo = null;
  let replyToName = '';

  const COLORS = [
    ['#1d9bf0','#1a56b0'], ['#f91880','#b5116e'], ['#00ba7c','#008c5e'],
    ['#ff7a00','#cc6000'], ['#7856ff','#5534cc'], ['#00c4d3','#009aa6'],
  ];
  function nameGradient(name) {
    let h = 0;
    for (const c of name) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
    return COLORS[h % COLORS.length];
  }
  function avatarStyle(name) {
    const [c1, c2] = nameGradient(name);
    return `background:linear-gradient(135deg,${c1},${c2})`;
  }
  function initial(name) { return name ? name.charAt(0).toUpperCase() : '?'; }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function handle(name) { return '@' + name.toLowerCase().replace(/\s+/g,'_'); }

  // ── Compose ──
  function updateComposeAvatar() {
    const n = nameInput.value.trim();
    const el = document.getElementById('composeAvatarEl');
    if (n) { el.setAttribute('style', avatarStyle(n)); el.textContent = initial(n); }
    else    { el.removeAttribute('style'); el.textContent = '?'; }
  }
  function updateCharCount() {
    const len = textInput.value.length;
    const el = document.getElementById('charCount');
    const rem = MAX_CHARS - len;
    if (len === 0) { el.textContent = ''; document.getElementById('postBtn').disabled = false; return; }
    el.textContent = rem;
    el.className = 'char-count' + (rem < 0 ? ' over' : rem < 20 ? ' warn' : '');
    document.getElementById('postBtn').disabled = rem < 0;
  }
  function scrollToCompose() {
    document.getElementById('composeBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
    textInput.focus();
  }

  // ── Reply ──
  function replyClick(id, name, e) {
    e.stopPropagation();
    replyTo = id;
    replyToName = name;
    document.getElementById('replyToName').textContent = handle(name);
    document.getElementById('replyBanner').classList.add('visible');
    textInput.focus();
    document.getElementById('composeBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function cancelReply() {
    replyTo = null;
    replyToName = '';
    document.getElementById('replyBanner').classList.remove('visible');
    document.getElementById('replyToName').textContent = '';
  }

  // ── Post ──
  async function post() {
    const name = nameInput.value.trim();
    const text = textInput.value.trim();
    if (!name || !text || text.length > MAX_CHARS) return;
    const btn = document.getElementById('postBtn');
    btn.disabled = true; btn.textContent = '投稿中…';
    try {
      await fetch("/api/sns/post", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, text, reply_to: replyTo })
      });
      textInput.value = '';
      updateCharCount();
      cancelReply();
      await load();
    } catch(e) {}
    btn.textContent = '投稿する';
    btn.disabled = false;
  }

  // ── Like ──
  async function like(id, e) {
    e.stopPropagation();
    await fetch("/api/sns/like", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ post_id: id })
    });
    load();
  }

  // ── Build HTML ──
  function buildRepliesHTML(replies) {
    return replies.map(r => `
      <div class="reply-tweet">
        <div class="reply-avatar" style="${avatarStyle(r.name)}">${esc(initial(r.name))}</div>
        <div class="reply-body">
          <div class="reply-header">
            <span class="reply-name">${esc(r.name)}</span>
            <span class="reply-handle">${esc(handle(r.name))}</span>
          </div>
          <div class="reply-text">${esc(r.text)}</div>
        </div>
      </div>`).join('');
  }

  function buildTweetHTML(p, replies) {
    return `
      <div class="tweet" data-id="${p.id}">
        <div class="tweet-avatar" style="${avatarStyle(p.name)}">${esc(initial(p.name))}</div>
        <div class="tweet-body">
          <div class="tweet-header">
            <span class="tweet-name">${esc(p.name)}</span>
            <span class="tweet-handle">${esc(handle(p.name))}</span>
          </div>
          <div class="tweet-text">${esc(p.text)}</div>
          <div class="tweet-actions">
            <div class="action-group" onclick="replyClick('${p.id}','${esc(p.name)}',event)">
              <button class="action-btn" title="返信">
                <svg viewBox="0 0 24 24"><path d="M14.046 2.242l-4.148-.01h-.002c-4.374 0-7.8 3.427-7.8 7.802 0 4.098 3.186 7.206 7.465 7.37v3.828c0 .108.044.286.12.403.142.225.384.347.632.347.138 0 .277-.038.402-.118.264-.168 6.473-4.14 8.088-5.506 1.902-1.61 3.04-3.97 3.043-6.312v-.017c-.006-4.367-3.43-7.787-7.8-7.788zm3.787 12.972c-1.134.96-4.862 3.405-6.772 4.643V16.67c0-.414-.335-.75-.75-.75h-.396c-3.66 0-6.318-2.476-6.318-5.886 0-3.534 2.768-6.302 6.3-6.302l4.147.01h.002c3.532 0 6.3 2.766 6.302 6.296-.003 1.91-.942 3.844-2.515 5.176z"/></svg>
                <span class="action-count">${replies.length || ''}</span>
              </button>
            </div>
            <div class="action-group rt" onclick="event.stopPropagation()">
              <button class="action-btn" title="リポスト">
                <svg viewBox="0 0 24 24"><path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z"/></svg>
              </button>
            </div>
            <div class="action-group like" onclick="like('${p.id}',event)">
              <button class="action-btn" title="いいね">
                <svg viewBox="0 0 24 24"><path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"/></svg>
                <span class="action-count">${p.likes || ''}</span>
              </button>
            </div>
            <div class="action-group" onclick="event.stopPropagation()">
              <button class="action-btn" title="共有">
                <svg viewBox="0 0 24 24"><path d="M12 2.59l5.7 5.7-1.41 1.42L13 6.41V16h-2V6.41l-3.3 3.3-1.41-1.42L12 2.59zM21 15l-.02 3.51c0 1.38-1.12 2.49-2.5 2.49H5.5C4.11 21 3 19.88 3 18.5V15h2v3.5c0 .28.22.5.5.5h12.98c.28 0 .5-.22.5-.5L19 15h2z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
      ${replies.length ? `<div class="replies-section">${buildRepliesHTML(replies)}</div>` : ''}`;
  }

  // ── Load ──
  async function load() {
    let data;
    try {
      const res = await fetch("/api/sns/timeline");
      data = await res.json();
    } catch(e) {
      if (!timeline.querySelector('.tweet')) {
        timeline.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg><strong>接続エラー</strong><p>サーバーに接続できません</p></div>`;
      }
      return;
    }
    const tops = data.filter(p => !p.reply_to);
    if (!tops.length) {
      timeline.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg><strong>まだポストがありません</strong><p>最初の投稿をしてみましょう</p></div>`;
      return;
    }
    timeline.innerHTML = tops.map(p => buildTweetHTML(p, data.filter(r => r.reply_to === p.id))).join('');
  }

  // ── Init ──
  const nameInput = document.getElementById("name");
  const textInput = document.getElementById("text");
  const timeline  = document.getElementById("timeline");

  textInput.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') post();
  });

  load();
  setInterval(load, 5000);
</script>
</body>
</html>
