<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini SNS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/sns.css">
</head>
<body>

<!-- ================================================================
     LOGIN SCREEN
     ================================================================ -->
<div id="loginScreen">
  <div class="login-logo">
    <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
  </div>
  <div class="login-card">
    <div class="login-title">いまどうしてる？</div>
    <p class="login-sub">Discordアカウントでログインして、タイムラインへ参加しましょう。</p>
    <a href="/auth/login" class="btn-discord">
      <!-- Discord logo -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#fff">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.003.022.015.04.031.051a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
      Discordでログイン
    </a>
    <p class="login-terms">
      ログインすることで、このサービスの利用規約およびプライバシーポリシーに同意したものとみなされます。
    </p>
  </div>
</div>

<!-- ================================================================
     APP SCREEN
     ================================================================ -->
<div id="appScreen">

  <!-- Left Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    </div>
    <nav style="display:flex;flex-direction:column;gap:4px;margin-top:4px;">
      <div class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.696L.622 8.807l1.06 1.696L3 9.679V19.5C3 20.881 4.119 22 5.5 22h4a1 1 0 001-1v-6h3v6a1 1 0 001 1h4c1.381 0 2.5-1.119 2.5-2.5V9.679l1.318.824 1.06-1.696L12 1.696z"/></svg>
        <span>ホーム</span>
      </div>
      <div class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M10.25 3.75c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5c1.795 0 3.419-.726 4.596-1.904 1.178-1.177 1.904-2.801 1.904-4.596 0-3.59-2.91-6.5-6.5-6.5zm-8.5 6.5c0-4.694 3.806-8.5 8.5-8.5s8.5 3.806 8.5 8.5c0 1.986-.682 3.815-1.814 5.262l4.276 4.276-1.414 1.414-4.276-4.276A8.456 8.456 0 0110.25 18.75c-4.694 0-8.5-3.806-8.5-8.5z"/></svg>
        <span>話題を検索</span>
      </div>
    </nav>

    <div class="sidebar-spacer"></div>

    <!-- User profile -->
    <div class="sidebar-profile" id="sidebarProfile" onclick="toggleProfilePopup()">
      <img class="sidebar-profile-avatar" id="sidebarAvatar" src="" alt="avatar">
      <div class="sidebar-profile-info">
        <div class="sidebar-profile-name"  id="sidebarName"></div>
        <div class="sidebar-profile-email" id="sidebarEmail"></div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--text-sub)" style="flex-shrink:0"><path d="M3 12c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2zm9 2c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm7 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
      <div class="profile-popup" id="profilePopup">
        <div class="popup-item logout" onclick="logout(event)">
          @<span id="popupHandle"></span> からログアウト
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Column -->
  <main class="main">
    <div class="col-header">
      <span class="col-header-title">ホーム</span>
    </div>

    <div class="reply-banner" id="replyBanner">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--accent)"><path d="M14.046 2.242l-4.148-.01h-.002c-4.374 0-7.8 3.427-7.8 7.802 0 4.098 3.186 7.206 7.465 7.37v3.828c0 .108.044.286.12.403.142.225.384.347.632.347.138 0 .277-.038.402-.118.264-.168 6.473-4.14 8.088-5.506 1.902-1.61 3.04-3.97 3.043-6.312v-.017c-.006-4.367-3.43-7.787-7.8-7.788zm3.787 12.972c-1.134.96-4.862 3.405-6.772 4.643V16.67c0-.414-.335-.75-.75-.75h-.396c-3.66 0-6.318-2.476-6.318-5.886 0-3.534 2.768-6.302 6.3-6.302l4.147.01h.002c3.532 0 6.3 2.766 6.302 6.296-.003 1.91-.942 3.844-2.515 5.176z"/></svg>
      返信先:&nbsp;<span class="reply-to-name" id="replyToName"></span>
      <span class="cancel-reply" onclick="cancelReply()" title="キャンセル">✕</span>
    </div>

    <div class="compose" id="composeBox">
      <img class="compose-avatar" id="composeAvatar" src="" alt="avatar">
      <div class="compose-right">
        <div class="compose-name" id="composeName"></div>
        <textarea id="text" placeholder="いまどうしてる？" rows="3" oninput="updateCharCount()"></textarea>
        <div class="compose-toolbar">
          <div class="toolbar-icon" title="画像">
            <svg viewBox="0 0 24 24"><path d="M3 5.5C3 4.119 4.119 3 5.5 3h13C19.881 3 21 4.119 21 5.5v13c0 1.381-1.119 2.5-2.5 2.5h-13C4.119 21 3 19.881 3 18.5v-13zM5.5 5c-.276 0-.5.224-.5.5v9.086l3-3 3 3 5-5 3 3V5.5c0-.276-.224-.5-.5-.5h-13zM19 15.414l-3-3-5 5-3-3-3 3V18.5c0 .276.224.5.5.5h13c.276 0 .5-.224.5-.5v-3.086zM9.75 7C8.784 7 8 7.784 8 8.75s.784 1.75 1.75 1.75 1.75-.784 1.75-1.75S10.716 7 9.75 7z"/></svg>
          </div>
          <div class="toolbar-icon" title="絵文字">
            <svg viewBox="0 0 24 24"><path d="M8 9.5C8 8.119 8.672 7 9.5 7S11 8.119 11 9.5 10.328 12 9.5 12 8 10.881 8 9.5zm6.5 0c0-1.381.672-2.5 1.5-2.5s1.5 1.119 1.5 2.5-.672 2.5-1.5 2.5-1.5-1.119-1.5-2.5zM12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8zm-3.5-5h7c-.501 2.498-3.16 4-3.5 4s-2.999-1.502-3.5-4z"/></svg>
          </div>
          <span class="char-count" id="charCount"></span>
          <button class="post-btn" id="postBtn" onclick="post()">投稿する</button>
        </div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab(this,'all')">おすすめ</div>
      <div class="tab"        onclick="switchTab(this,'mine')">自分の投稿</div>
    </div>

    <div id="timeline">
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        <strong>読み込み中…</strong>
      </div>
    </div>
  </main>

  <!-- Right Sidebar -->
  <aside class="right-sidebar">
    <div class="search-bar">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24"><path d="M10.25 3.75c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5c1.795 0 3.419-.726 4.596-1.904 1.178-1.177 1.904-2.801 1.904-4.596 0-3.59-2.91-6.5-6.5-6.5zm-8.5 6.5c0-4.694 3.806-8.5 8.5-8.5s8.5 3.806 8.5 8.5c0 1.986-.682 3.815-1.814 5.262l4.276 4.276-1.414 1.414-4.276-4.276A8.456 8.456 0 0110.25 18.75c-4.694 0-8.5-3.806-8.5-8.5z"/></svg>
        <input type="text" placeholder="検索" id="searchInput" oninput="renderTimeline()">
      </div>
    </div>
    <div class="widget-box">
      <div class="widget-title">いまどうなってる</div>
      <div class="trend-item">
        <div class="trend-cat">ポスト数</div>
        <div class="trend-name" id="trendPostCount">―</div>
      </div>
      <div class="trend-item">
        <div class="trend-cat">参加メンバー</div>
        <div class="trend-name" id="trendUsers">―</div>
      </div>
    </div>
  </aside>

</div>

<script>
/* ── State ── */
const MAX_CHARS  = 280;
let currentUser  = null;
let replyTo      = null;
let allPosts     = [];
let currentTab   = 'all';

/* ── Auth ── */
async function initAuth() {
  try {
    const res  = await fetch('/auth/me');
    const user = await res.json();
    if (user && user.id) { currentUser = user; showApp(); }
    else                  { showLogin(); }
  } catch { showLogin(); }
}

function showLogin() {
  document.getElementById('loginScreen').classList.add('visible');
  document.getElementById('appScreen').classList.remove('visible');
}

function showApp() {
  document.getElementById('loginScreen').classList.remove('visible');
  document.getElementById('appScreen').classList.add('visible');
  const u = currentUser;
  const h = u.name.toLowerCase().replace(/\s+/g,'_');
  document.getElementById('sidebarAvatar').src       = u.picture || '';
  document.getElementById('sidebarName').textContent  = u.name;
  document.getElementById('sidebarEmail').textContent = u.email;
  document.getElementById('popupHandle').textContent  = h;
  document.getElementById('composeAvatar').src        = u.picture || '';
  document.getElementById('composeName').textContent  = u.name;
  load();
}

function toggleProfilePopup() {
  document.getElementById('profilePopup').classList.toggle('open');
}
function logout(e) {
  e.stopPropagation();
  window.location.href = '/auth/logout';
}
document.addEventListener('click', e => {
  if (!e.target.closest('#sidebarProfile'))
    document.getElementById('profilePopup').classList.remove('open');
});

/* ── Compose ── */
function updateCharCount() {
  const len = textInput.value.length;
  const rem = MAX_CHARS - len;
  const el  = document.getElementById('charCount');
  el.textContent = len > 0 ? rem : '';
  el.className   = 'char-count' + (rem < 0 ? ' over' : rem < 20 ? ' warn' : '');
  document.getElementById('postBtn').disabled = len === 0 || rem < 0;
}

/* ── Reply ── */
function replyClick(id, name, e) {
  e.stopPropagation();
  replyTo = id;
  document.getElementById('replyToName').textContent = '@' + hnd(name);
  document.getElementById('replyBanner').classList.add('visible');
  textInput.focus();
  document.getElementById('composeBox').scrollIntoView({ behavior:'smooth', block:'nearest' });
}
function cancelReply() {
  replyTo = null;
  document.getElementById('replyBanner').classList.remove('visible');
  document.getElementById('replyToName').textContent = '';
}

/* ── Tabs ── */
function switchTab(el, tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentTab = tab;
  renderTimeline();
}

/* ── API ── */
async function post() {
  const text = textInput.value.trim();
  if (!text || text.length > MAX_CHARS) return;
  const btn = document.getElementById('postBtn');
  btn.disabled = true; btn.textContent = '投稿中…';
  try {
    const res = await fetch('/api/sns/post', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, reply_to: replyTo }),
    });
    if (res.status === 401) { showLogin(); return; }
    textInput.value = '';
    updateCharCount();
    cancelReply();
    await load();
  } catch {}
  btn.textContent = '投稿する'; btn.disabled = false;
}

async function like(id, e) {
  e.stopPropagation();
  const res = await fetch('/api/sns/like', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ post_id: id }),
  });
  if (res.status === 401) { showLogin(); return; }
  await load();
}

async function deletePost(id, e) {
  e.stopPropagation();
  if (!confirm('この投稿を削除しますか？\n（リプライもすべて削除されます）')) return;
  const res = await fetch('/api/sns/delete/' + id, { method: 'DELETE' });
  if (res.status === 401) { showLogin(); return; }
  await load();
}

async function load() {
  try {
    const res = await fetch('/api/sns/timeline');
    if (res.status === 401) { showLogin(); return; }
    allPosts = await res.json();
    updateStats();
    renderTimeline();
  } catch {
    if (!timeline.querySelector('.tweet'))
      timeline.innerHTML = emptyHTML('接続エラー', 'サーバーに接続できません');
  }
}

/* ── Helpers ── */
function hnd(name) { return name.toLowerCase().replace(/\s+/g,'_'); }
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function avatarImg(pic, name, cls, size) {
  const style = `width:${size}px;height:${size}px;border-radius:50%;flex-shrink:0;`;
  if (pic) return `<img class="${cls}" src="${esc(pic)}" alt="${esc(name)}" style="${style}object-fit:cover" onerror="this.style.display='none'">`;
  return `<div class="${cls}" style="${style}display:flex;align-items:center;justify-content:center;background:#2f3336;font-weight:700;font-size:${Math.floor(size*0.4)}px;color:#e7e9ea">${esc(name.charAt(0).toUpperCase())}</div>`;
}
function emptyHTML(title, sub) {
  return `<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg><strong>${title}</strong><p>${sub}</p></div>`;
}

/* ── Render ── */
function buildRepliesHTML(replies) {
  return replies.map(r => `
    <div class="reply-tweet">
      ${avatarImg(r.picture, r.name, 'reply-avatar', 32)}
      <div class="reply-body">
        <div class="reply-header">
          <span class="reply-name">${esc(r.name)}</span>
          <span class="reply-handle">@${esc(hnd(r.name))}</span>
        </div>
        <div class="reply-text">${esc(r.text)}</div>
      </div>
    </div>`).join('');
}

function buildTweetHTML(p, replies) {
  const likedClass = p.liked ? ' liked' : '';
  const likeCount  = p.likes > 0 ? p.likes : '';
  const replyCount = replies.length > 0 ? replies.length : '';
  const deleteBtnHTML = p.is_mine ? `
    <div class="action-group del" onclick="deletePost('${p.id}',event)">
      <button class="action-btn" title="削除">
        <svg viewBox="0 0 24 24"><path d="M16 6V4.5C16 3.12 14.88 2 13.5 2h-3C9.12 2 8 3.12 8 4.5V6H3v2h1.06l.81 11.21C4.98 20.78 6.28 22 7.86 22h8.29c1.58 0 2.87-1.22 2.98-2.79L19.93 8H21V6h-5zm-6-1.5c0-.28.22-.5.5-.5h3c.28 0 .5.22.5.5V6h-4V4.5zm7.13 14.57c-.04.52-.47.93-1 .93H7.86c-.53 0-.96-.41-1-.93L6.07 8h11.85l-.79 11.07z"/></svg>
      </button>
    </div>` : '';

  return `
    <div class="tweet" data-id="${p.id}">
      ${avatarImg(p.picture, p.name, 'tweet-avatar', 40)}
      <div class="tweet-body">
        <div class="tweet-header">
          <span class="tweet-name">${esc(p.name)}</span>
          <span class="tweet-handle">@${esc(hnd(p.name))}</span>
        </div>
        <div class="tweet-text">${esc(p.text)}</div>
        <div class="tweet-actions">
          <div class="action-group" onclick="replyClick('${p.id}','${esc(p.name)}',event)">
            <button class="action-btn" title="返信">
              <svg viewBox="0 0 24 24"><path d="M14.046 2.242l-4.148-.01h-.002c-4.374 0-7.8 3.427-7.8 7.802 0 4.098 3.186 7.206 7.465 7.37v3.828c0 .108.044.286.12.403.142.225.384.347.632.347.138 0 .277-.038.402-.118.264-.168 6.473-4.14 8.088-5.506 1.902-1.61 3.04-3.97 3.043-6.312v-.017c-.006-4.367-3.43-7.787-7.8-7.788zm3.787 12.972c-1.134.96-4.862 3.405-6.772 4.643V16.67c0-.414-.335-.75-.75-.75h-.396c-3.66 0-6.318-2.476-6.318-5.886 0-3.534 2.768-6.302 6.3-6.302l4.147.01h.002c3.532 0 6.3 2.766 6.302 6.296-.003 1.91-.942 3.844-2.515 5.176z"/></svg>
              <span class="action-count">${replyCount}</span>
            </button>
          </div>
          <div class="action-group like${likedClass}" onclick="like('${p.id}',event)">
            <button class="action-btn" title="いいね">
              <svg viewBox="0 0 24 24"><path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"/></svg>
              <span class="action-count">${likeCount}</span>
            </button>
          </div>
          ${deleteBtnHTML}
        </div>
      </div>
    </div>
    ${replies.length ? `<div class="replies-section">${buildRepliesHTML(replies)}</div>` : ''}`;
}

function renderTimeline() {
  const query = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
  let tops = allPosts.filter(p => !p.reply_to);
  if (currentTab === 'mine' && currentUser) tops = tops.filter(p => p.user_id === currentUser.id);
  if (query) tops = tops.filter(p => p.text.toLowerCase().includes(query) || p.name.toLowerCase().includes(query));

  if (!tops.length) {
    const msgs = {
      mine:   ['まだ投稿していません', '最初の投稿をしてみましょう'],
      search: ['該当なし', '別のキーワードで検索してみてください'],
      empty:  ['まだポストがありません', '最初の投稿をしてみましょう'],
    };
    const k = currentTab==='mine' ? 'mine' : query ? 'search' : 'empty';
    timeline.innerHTML = emptyHTML(...msgs[k]);
    return;
  }
  timeline.innerHTML = tops.map(p => buildTweetHTML(p, allPosts.filter(r => r.reply_to === p.id))).join('');
}

function updateStats() {
  const tops  = allPosts.filter(p => !p.reply_to);
  const users = new Set(allPosts.map(p => p.user_id)).size;
  document.getElementById('trendPostCount').textContent = `${tops.length}件のポスト`;
  document.getElementById('trendUsers').textContent     = `${users}人`;
}

/* ── Init ── */
